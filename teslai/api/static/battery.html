<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>teslai battery</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main>
  <nav class="tabs"><a href="/">Day</a><a href="/months">Months</a><a href="/battery" aria-current="page">Battery</a></nav>
  <header><h1>Battery</h1><select id="vehicle" aria-label="Vehicle"></select></header>
  <section class="totals" id="tiles" aria-live="polite"></section>
  <figure class="chart">
    <svg id="chart" role="img" aria-labelledby="chart-title" viewBox="0 0 720 280" preserveAspectRatio="none"></svg>
    <figcaption id="chart-title">Estimated range at 100% by charge, with monthly medians</figcaption>
  </figure>
  <p class="note">Estimated from charges ending at 50% or higher. Baseline is the median of the five highest estimates in the first 90 days; current is the median of the latest five.</p>
  <div id="msg"></div>
</main>
<script src="/static/common.js"></script>
<script>
async function load() {
  const v = $("vehicle").value;
  const r = await authFetch(`/api/v1/vehicles/${v}/battery`);
  if (!r) return;
  const b = await r.json();
  if (!b.points.length) { $("tiles").innerHTML = ""; $("chart").innerHTML = ""; $("msg").innerHTML = '<p class="empty">No charges ending at 50% or higher yet.</p>'; return; }
  $("msg").innerHTML = "";
  $("tiles").innerHTML = [[b.baseline.toFixed(1), "baseline range (mi)"], [b.current.toFixed(1), "current range (mi)"],
    [`${b.loss_pct.toFixed(1)}%`, "estimated loss"], [b.points.length, "charges used"]]
    .map(([n, l]) => `<div class="tile"><b>${n}</b><span>${l}</span></div>`).join("");
  const W = 720, H = 280, pad = 36;
  const xs = b.points.map((p) => new Date(p.date).getTime());
  const ys = b.points.map((p) => p.est_100_range);
  const x0 = Math.min(...xs), x1 = Math.max(...xs) || x0 + 1;
  const y0 = Math.floor(Math.min(...ys) - 3), y1 = Math.ceil(Math.max(...ys) + 3);
  const sx = (t) => pad + (t - x0) / Math.max(1, x1 - x0) * (W - 2 * pad);
  const sy = (y) => H - pad - (y - y0) / Math.max(1, y1 - y0) * (H - 2 * pad);
  const dots = b.points.map((p) => `<circle cx="${sx(new Date(p.date).getTime())}" cy="${sy(p.est_100_range)}" r="2.5" class="dot-pt"><title>${p.date}: ${p.est_100_range} mi</title></circle>`).join("");
  const med = b.months.map((m) => `${sx(new Date(m.month + "-15").getTime())},${sy(m.median_est_100_range)}`).join(" ");
  const grid = [y0, (y0 + y1) / 2, y1].map((y) => `<line x1="${pad}" x2="${W - pad}" y1="${sy(y)}" y2="${sy(y)}" class="grid"/><text x="4" y="${sy(y) + 4}" class="axis">${Math.round(y)}</text>`).join("");
  $("chart").innerHTML = `${grid}${dots}<polyline points="${med}" class="median"/>`;
}
initVehiclePage(load);
</script>
</body>
</html>
