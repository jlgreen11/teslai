<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>teslai day</title>
<style>
  :root { color-scheme: light dark; --fg: #1d1d1f; --muted: #6e6e73; --bg: #fbfbfd; --line: #e5e5ea;
          --drive: #0a84ff; --charge: #30a46c; --idle: #a1a1a6; --sleep: #5e5ce6; --unreachable: #ff9f0a; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --muted: #98989d; --bg: #1c1c1e; --line: #38383a; } }
  body { margin: 0; padding: 16px; font: 15px/1.4 -apple-system, system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  main { max-width: 760px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
  h1 { font-size: 22px; margin: 0; }
  .nav { display: flex; gap: 8px; align-items: center; }
  button, input, select { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; }
  .totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin: 16px 0; }
  .tile { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .tile b { display: block; font-size: 22px; }
  .tile span { color: var(--muted); font-size: 13px; }
  .bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--line); margin: 8px 0 16px; }
  .bar div { height: 100%; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .empty, .error { color: var(--muted); padding: 24px 0; }
  .error { color: #ff453a; }
</style>
</head>
<body>
<main>
  <nav class="tabs" style="display:flex;gap:4px;margin-bottom:12px"><a href="/" aria-current="page" style="padding:6px 12px;border-radius:8px;background:var(--line);color:var(--fg);text-decoration:none">Day</a><a href="/months" style="padding:6px 12px;color:var(--muted);text-decoration:none">Months</a><a href="/battery" style="padding:6px 12px;color:var(--muted);text-decoration:none">Battery</a></nav>
  <header>
    <h1>Day</h1>
    <div class="nav">
      <select id="vehicle" aria-label="Vehicle"></select>
      <button id="prev" aria-label="Previous day">&larr;</button>
      <input id="date" type="date" aria-label="Date">
      <button id="next" aria-label="Next day">&rarr;</button>
    </div>
  </header>
  <section class="totals" id="totals" aria-live="polite"></section>
  <div class="bar" id="bar" aria-hidden="true"></div>
  <div id="list"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const colors = { drive: "var(--drive)", charge: "var(--charge)", idle: "var(--idle)", sleep: "var(--sleep)", unreachable: "var(--unreachable)" };
const fmtTime = (iso) => iso ? new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "now";
const today = () => new Date().toLocaleDateString("en-CA");

function detail(s) {
  if (s.kind === "drive") {
    const route = s.start_place || s.end_place ? ` · ${s.start_place || "?"} → ${s.end_place || "?"}` : "";
    return (s.distance_miles != null ? `${s.distance_miles.toFixed(1)} mi` : "") + route;
  }
  const place = s.end_place || s.start_place;
  const where = place ? ` · ${place}` : "";
  if (s.kind === "charge") return s.energy_added_kwh != null ? `${s.energy_added_kwh.toFixed(1)} kWh ${s.charger ? s.charger.toUpperCase() : ""}${s.cost != null ? ` · ${s.cost.toFixed(2)}` : ""}${where}` : where;
  return where.replace(" · ", "");
}

async function load() {
  const v = $("vehicle").value, d = $("date").value;
  $("list").innerHTML = '<p class="empty">Loading…</p>';
  try {
    const r = await fetch(`/api/v1/vehicles/${v}/days/${d}`);
    if (r.status === 401) { location.href = "/login"; return; }
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const day = await r.json();
    $("totals").innerHTML = [
      [day.drives, "drives"], [day.miles.toFixed(1), "miles"], [day.charges, "charges"], [day.kwh_added.toFixed(1), "kWh added"],
      [new Intl.NumberFormat([], { style: "currency", currency: day.currency }).format(day.charging_cost), "charging cost"],
    ].map(([n, l]) => `<div class="tile"><b>${n}</b><span>${l}</span></div>`).join("");
    const startOfDay = new Date(`${d}T00:00:00`).getTime(), dayMs = 24 * 3600e3;
    $("bar").innerHTML = day.sessions.map((s) => {
      const a = Math.max(new Date(s.start).getTime(), startOfDay);
      const b = Math.min(s.end ? new Date(s.end).getTime() : Date.now(), startOfDay + dayMs);
      const w = Math.max(0, (b - a) / dayMs * 100);
      return `<div title="${s.kind}" style="width:${w}%;background:${colors[s.kind]}"></div>`;
    }).join("");
    if (!day.sessions.length) { $("list").innerHTML = '<p class="empty">No activity logged for this day.</p>'; return; }
    $("list").innerHTML = `<table><thead><tr><th>Activity</th><th>From</th><th>To</th><th>Detail</th><th>Battery</th></tr></thead><tbody>${
      day.sessions.map((s) => `<tr><td><span class="dot" style="background:${colors[s.kind]}"></span>${s.kind}</td><td>${fmtTime(s.start)}</td><td>${fmtTime(s.end)}</td><td>${detail(s)}</td><td>${s.start_battery ?? "–"}% → ${s.end_battery ?? "–"}%</td></tr>`).join("")
    }</tbody></table>`;
  } catch (e) {
    $("list").innerHTML = `<p class="error">Could not load this day: ${e.message}</p>`;
  }
}

function shift(days) {
  const d = new Date(`${$("date").value}T12:00:00`); d.setDate(d.getDate() + days);
  $("date").value = d.toLocaleDateString("en-CA"); load();
}

(async () => {
  $("date").value = new URLSearchParams(location.search).get("date") || today();
  try {
    const vr = await fetch("/api/v1/vehicles");
    if (vr.status === 401) { location.href = "/login"; return; }
    const vs = await vr.json();
    if (!Array.isArray(vs) || !vs.length) { $("list").innerHTML = '<p class="empty">No vehicles yet. Import history with <code>teslai import teslafi --write</code>.</p>'; return; }
    $("vehicle").innerHTML = vs.map((v) => `<option value="${v.id}">${v.display_name || "Car"} ···${v.vin_last4}</option>`).join("");
  } catch (e) { $("list").innerHTML = `<p class="error">API unavailable: ${e.message}</p>`; return; }
  $("prev").onclick = () => shift(-1); $("next").onclick = () => shift(1);
  $("date").onchange = load; $("vehicle").onchange = load; load();
})();
</script>
</body>
</html>
