# Copy to config/tariffs.yaml (gitignored) and edit. teslai uses the example
# only when tariffs.yaml does not exist.
currency: USD

home:
  default_price_per_kwh: 0.14
  # Time-of-use windows in the vehicle's local time. A window may cross midnight.
  # The first matching window wins; times outside every window use the default.
  schedules:
    - {days: [mon, tue, wed, thu, fri], start: "21:00", end: "06:00", price_per_kwh: 0.07}
    - {days: [sat, sun], start: "00:00", end: "24:00", price_per_kwh: 0.09}

public:
  default_price_per_kwh: 0.30

supercharger:
  default_price_per_kwh: 0.42

# Charging at these place names costs nothing (matched against places.csv names).
free_places: []

gas:
  price_per_gallon: 3.20
  mpg: 28
