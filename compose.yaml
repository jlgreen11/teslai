# teslai stack.
#   default:  db, mosquitto, app (localhost:8000), worker, monitor, backup
#   edge:     caddy, public key hosting on TESLAI_DOMAIN (docker compose --profile edge up -d)
#   edge also runs fleet-telemetry (car mTLS on TESLAI_TELEMETRY_PORT) and the
#   vehicle-command proxy (internal network only). Run `teslai telemetry server-config` first.
# Containers run as TESLAI_UID:TESLAI_GID (written by `teslai init`) so they can read the
# 0600 files in secrets/. Third-party images are pinned by multi-arch digest; update a pin
# deliberately with `docker buildx imagetools inspect <image:tag>`.
# Pin image digests before deploying to the VM (see docs/ARCHITECTURE.md, section 9).
name: teslai

services:
  db:
    build: ./ops/db
    image: teslai-db:16-postgis3
    restart: unless-stopped
    environment:
      POSTGRES_DB: teslai
      POSTGRES_USER: teslai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run teslai init first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teslai -d teslai"]
      interval: 5s
      timeout: 3s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./ops/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqttdata:/mosquitto/data

  app:
    build: .
    image: teslai-app:dev
    restart: unless-stopped
    user: "${TESLAI_UID:-10001}:${TESLAI_GID:-10001}"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://teslai:${POSTGRES_PASSWORD}@db:5432/teslai
      MQTT_HOST: mosquitto
      TESLAI_SECRETS_DIR: /app/secrets
      TESLA_PROXY_URL: https://vehicle-command:4443
      TESLA_PROXY_CA: /app/secrets/ca.cert.pem
    volumes:
      - ./secrets:/app/secrets:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: teslai-app:dev
    restart: unless-stopped
    user: "${TESLAI_UID:-10001}:${TESLAI_GID:-10001}"
    command: ["teslai", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://teslai:${POSTGRES_PASSWORD}@db:5432/teslai
      MQTT_HOST: mosquitto
      TESLAI_SECRETS_DIR: /app/secrets
      TESLAI_RECORDINGS_DIR: /app/recordings
    volumes:
      - ./secrets:/app/secrets:ro
      - ./recordings:/app/recordings
    depends_on:
      app:
        condition: service_started
      mosquitto:
        condition: service_started

  monitor:
    image: teslai-app:dev
    restart: unless-stopped
    user: "${TESLAI_UID:-10001}:${TESLAI_GID:-10001}"
    command: ["teslai", "monitor"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://teslai:${POSTGRES_PASSWORD}@db:5432/teslai
      TESLAI_SECRETS_DIR: /app/secrets
      TESLAI_BACKUP_DIR: /app/backups
    volumes:
      - ./secrets:/app/secrets:ro
      - ./backups:/app/backups:ro
    depends_on:
      app:
        condition: service_started

  backup:
    image: teslai-db:16-postgis3
    restart: unless-stopped
    user: "${TESLAI_UID:-10001}:${TESLAI_GID:-10001}"
    entrypoint: ["bash", "/ops/backup.sh"]
    command: ["loop"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
    volumes:
      - ./ops/backup/backup.sh:/ops/backup.sh:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2@sha256:13ba145cba2f3e28fa801994876e4c086d1b95d5aa2a520a734765ffb6b12017
    profiles: ["edge"]
    restart: unless-stopped
    environment:
      TESLAI_DOMAIN: ${TESLAI_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./secrets/com.tesla.3p.public-key.pem:/srv/tesla/com.tesla.3p.public-key.pem:ro
      - caddydata:/data

  fleet-telemetry:
    image: tesla/fleet-telemetry:v0.9.0@sha256:f925c73f1f8ddc8aa97440bf96c0955403936046ba51805db7b701413a06f187
    profiles: ["edge"]
    restart: unless-stopped
    user: "${TESLAI_UID:-10001}:${TESLAI_GID:-10001}"
    command: ["/fleet-telemetry", "-config=/etc/teslai-certs/fleet-telemetry.json"]
    ports:
      - "${TESLAI_TELEMETRY_PORT:-4443}:${TESLAI_TELEMETRY_PORT:-4443}"
    volumes:
      - ./secrets:/etc/teslai-certs:ro
    depends_on:
      mosquitto:
        condition: service_started

  vehicle-command:
    image: tesla/vehicle-command:latest@sha256:e8adac679bf5e72790c588e620bb4a7992a8f80d4c3bd98da6d1129f59daf482
    profiles: ["edge"]
    restart: unless-stopped
    # The image's entrypoint is tesla-http-proxy; these are its flags only.
    user: "${TESLAI_UID:-10001}:${TESLAI_GID:-10001}"
    command: ["-tls-key", "/secrets/proxy-tls.key.pem",
              "-cert", "/secrets/proxy-tls.cert.pem",
              "-key-file", "/secrets/tesla-app.private-key.pem",
              "-host", "0.0.0.0", "-port", "4443"]
    expose:
      - "4443"
    volumes:
      - ./secrets:/secrets:ro

volumes:
  dbdata:
  mqttdata:
  caddydata:
