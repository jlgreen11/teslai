# teslai stack. Phase 0 services: db, mosquitto.
# fleet-telemetry, vehicle-command, app, worker and caddy are added as each phase lands.
# Pin image digests before deploying to the VM (see docs/ARCHITECTURE.md, section 9).
name: teslai

services:
  db:
    build: ./ops/db
    image: teslai-db:16-postgis3
    restart: unless-stopped
    environment:
      POSTGRES_DB: teslai
      POSTGRES_USER: teslai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run teslai init first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teslai -d teslai"]
      interval: 5s
      timeout: 3s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./ops/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqttdata:/mosquitto/data

volumes:
  dbdata:
  mqttdata:
