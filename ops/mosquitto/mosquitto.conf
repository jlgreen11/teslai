# Durable broker for Fleet Telemetry messages.
# Messages survive broker and worker restarts only with all of:
#   persistence here, QoS 1 on publish and subscribe, a fixed worker client id
#   with clean_session=false, and reliable_ack on fleet-telemetry's MQTT dispatcher.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
max_queued_messages 1000000
max_inflight_messages 100

listener 1883
# The broker is only reachable on the internal compose network.
allow_anonymous true

log_dest stdout
log_type error
log_type warning
log_type notice
