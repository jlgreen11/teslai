[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "teslai"
version = "0.1.0"
description = "Personal Tesla data logger and TeslaFi replacement built on Tesla Fleet Telemetry"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "typer>=0.12",
  "pydantic-settings>=2.4",
  "pyyaml>=6",
  "cryptography>=43",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "paho-mqtt>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
teslai = "teslai.cli:app"

[tool.setuptools.packages.find]
include = ["teslai*"]

[tool.setuptools.package-data]
teslai = ["api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running Postgres (TESLAI_TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]

[tool.ruff.lint.flake8-bugbear]
# Typer and FastAPI declare options and query parameters as argument defaults by design.
extend-immutable-calls = ["typer.Option", "typer.Argument", "pathlib.Path", "fastapi.Query"]
